apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudpulse-config
  labels:
    app: cloudpulse
data:
  config.yaml: |
    interval_seconds: 30
    timeout_seconds: 5
    host: 0.0.0.0
    port: 8080
    history_size: 100
    targets:
      - name: example
        url: https://example.com
        expected_status: 200
