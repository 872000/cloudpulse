apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloudpulse.fullname" . }}-config
  labels:
    {{- include "cloudpulse.labels" . | nindent 4 }}
data:
  config.yaml: |
    interval_seconds: {{ .Values.config.intervalSeconds }}
    timeout_seconds: {{ .Values.config.timeoutSeconds }}
    host: 0.0.0.0
    port: 8080
    history_size: {{ .Values.config.historySize }}
    targets:
    {{- range .Values.config.targets }}
      - name: {{ .name }}
        url: {{ .url }}
        expected_status: {{ .expected_status | default 200 }}
    {{- end }}
